spring:
  application:
    name: BaiZuHui
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/good?serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5  # 最小空闲连接数
      maximum-pool-size: 20  # 最大连接数
      auto-commit: true  # 自动提交模式
      transaction-isolation: TRANSACTION_READ_COMMITTED  # 隔离级别
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 9999
  servlet:
    context-path: /
    swagger-ui:
      path: /swagger-ui.html
jwt:
  secret: ${JWT_SECRET:change-me-in-local-config}
wechat:
  appid: ${WECHAT_APPID:}
  secret: ${WECHAT_SECRET:}
  login-url: https://api.weixin.qq.com/sns/jscode2session